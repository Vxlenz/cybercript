<g font-family="monospace" font-size="31" font-weight="700" text-anchor="middle"><g fill="#245b4e"><text x="194" y="81">A</text><text x="269" y="81">B</text><text x="344" y="81">C</text><text x="419" y="81">D</text></g><g fill="#245b4e"><text x="194" y="168">D</text><text x="269" y="168">E</text><text x="344" y="168">F</text><text x="419" y="168">G</text></g></g>
